<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Hero Section - Darker Purple</title>
  <!-- นำเข้า Tailwind CSS ผ่าน CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f4f9] min-h-screen text-[#18181b] font-sans antialiased">

  <!-- Container หลักครอบทั้งหน้าจอ -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    
    <!-- 1. NAVIGATION BAR -->
    <header class="bg-white rounded-full shadow-sm px-8 py-4 flex items-center justify-between">
      <!-- โลโก้ Acme -->
      <div class="flex items-center">
        <span class="text-2xl font-extrabold tracking-tight text-black">
          Acme<span class="text-[#4338ca] inline-block ml-0.5">.</span>
        </span>
      </div>

      <!-- เมนูนำทางด้านขวา -->
      <nav class="flex items-center space-x-8 font-medium text-sm">
        <a href="#" class="text-[#4338ca] underline underline-offset-4 decoration-2 font-semibold">Home</a>
        <a href="#" class="text-gray-700 hover:text-black transition">Features</a>
        <a href="#" class="text-gray-700 hover:text-black transition">Pricing</a>
        <a href="#" class="text-gray-700 hover:text-black transition">Contact</a>
      </nav>
    </header>

    <!-- 2. HERO SECTION -->
    <main class="flex flex-col items-center justify-center text-center mt-20 md:mt-28 px-4 pb-16">
      
      <!-- Badge แสดงแท็ก Acme Productivity App -->
      <div class="inline-flex items-center gap-2 bg-[#e0e7ff] border border-[#c7d2fe] text-[#4338ca] px-4 py-1.5 rounded-full text-sm font-semibold mb-8">
        <span>🌈</span>
        <span>Acme Productivity App</span>
      </div>

      <!-- หัวข้อหลัก (Main Heading) -->
      <h1 class="text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tight leading-tight text-[#111827] max-w-4xl">
        Boost Your <span class="text-[#4338ca]">Product</span>ivity
      </h1>

      <!-- คำอธิบายย่อย (Subheading) -->
      <p class="mt-6 text-lg sm:text-xl text-gray-700 font-medium max-w-2xl">
        Streamline your workflow with our all-in-one productivity app.
      </p>

      <!-- ปุ่ม Call to Action (Start Free Trial) -->
      <div class="mt-8">
        <button class="bg-[#1e1b2e] hover:bg-[#2e2a45] text-white px-7 py-3.5 rounded-xl font-medium text-sm shadow-md transition duration-200">
          Start Free Trial
        </button>
      </div>

    </main>

  </div>

</body>
</html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-gray-800 min-h-screen flex flex-col justify-between p-6 md:p-12">

    <!-- ส่วนเนื้อหาหลัก (Container ตรงกลาง) -->
    <main class="flex-grow flex items-center justify-center my-8">
        <!-- การ์ดสีขาวหลัก -->
        <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl p-8 md:p-16">
            
            <!-- หัวข้อ Get in Touch -->
            <h2 class="text-3xl md:text-4xl font-bold text-center text-gray-900 mb-10">
                Get in Touch
            </h2>

            <!-- ฟอร์มติดต่อ -->
            <form class="space-y-6 max-w-2xl mx-auto">
                
                <!-- ช่องกรอก Name -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
                        Name
                    </label>
                    <input type="text" placeholder="John Doe" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-gray-400 text-gray-700 placeholder-gray-400 text-sm transition">
                </div>

                <!-- ช่องกรอก Email -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
                        Email
                    </label>
                    <input type="email" placeholder="john@example.com" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-gray-400 text-gray-700 placeholder-gray-400 text-sm transition">
                </div>

                <!-- ช่องกรอก Message -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
                        Message
                    </label>
                    <textarea rows="4" placeholder="Your message..." 
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-gray-400 text-gray-700 placeholder-gray-400 text-sm transition resize-none"></textarea>
                </div>

                <!-- ปุ่ม Submit -->
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full py-3.5 bg-[#141824] hover:bg-gray-800 text-white font-medium rounded-xl transition duration-200 shadow-md">
                        Submit
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- ส่วน Footer ด้านล่างสุด -->
    <footer class="max-w-4xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center text-xs text-gray-400 gap-4 pt-4">
        <div>
            Acme productivity app ©2024
        </div>
        <div class="flex space-x-6">
            <a href="#" class="hover:text-white transition">FAQ</a>
            <a href="#" class="hover:text-white transition">Terms</a>
            <a href="#" class="hover:text-white transition">AI Policy</a>
            <a href="#" class="hover:text-white transition">Pricing</a>
        </div>
    </footer>

</body>
</html>
